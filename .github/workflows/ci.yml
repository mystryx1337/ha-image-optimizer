name: CI Tests & Quality Gate

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  php-matrix:
    name: PHP ${{ matrix.php }} Quality & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, gd, imagick
          coverage: none

      - name: Lint all PHP files
        run: |
          find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

      - name: Check JS syntax (Node.js)
        if: matrix.php == '8.2'
        run: |
          for f in assets/js/*.js; do
            if [ -f "$f" ]; then
              node --check "$f"
            fi
          done

      - name: Run Standalone Test Suite
        run: php tests/run_tests.php
